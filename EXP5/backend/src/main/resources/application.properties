spring.application.name=rest-api-lab
server.port=8080

# Logging configuration
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=INFO

# Console pattern including Correlation ID from MDC: [%X{correlationId}]
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) [%cyan(%X{correlationId})] %logger{36} - %msg%n
